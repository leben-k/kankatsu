<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4f7"/>
      <stop offset="1" stop-color="#eaf6fc"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="31" fill="url(#sky)" stroke="#dba9a0" stroke-width="0"/>

  <!-- ground -->
  <path d="M4 50 H60 V56 C60 58 58 60 56 60 H8 C6 60 4 58 4 56 Z" fill="#d7c9a8"/>

  <!-- building body -->
  <rect x="14" y="30" width="36" height="22" rx="1.5" fill="#fdfaf3" stroke="#2c4a70" stroke-width="1.6"/>

  <!-- roof / pediment -->
  <path d="M10 30 L32 14 L54 30 Z" fill="#2c4a70"/>
  <path d="M16 29 L32 18 L48 29 Z" fill="#3f6491"/>

  <!-- columns -->
  <rect x="19" y="34" width="4" height="18" fill="#c9def0"/>
  <rect x="30" y="34" width="4" height="18" fill="#c9def0"/>
  <rect x="41" y="34" width="4" height="18" fill="#c9def0"/>

  <!-- steps -->
  <rect x="12" y="50" width="40" height="3" fill="#2c4a70"/>

  <!-- door -->
  <rect x="28.5" y="43" width="7" height="9" rx="1" fill="#2c4a70"/>

  <!-- koban red lamp on roof -->
  <rect x="30.5" y="20.5" width="3" height="4" fill="#2c4a70"/>
  <circle cx="32" cy="18.5" r="3.4" fill="#e2544a" stroke="#a93429" stroke-width="1"/>
  <circle cx="30.8" cy="17.3" r="0.9" fill="#ffffff" opacity=".8"/>
</svg>
